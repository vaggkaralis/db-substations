name: CI - Run tests

on:
  # Legacy workflow kept for historical runs and manual fallback only.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8
      - name: Run ruff
        run: |
          python -m ruff format --check . --exclude scripts
          python -m ruff check . --exclude scripts
          python -m ruff format --check scripts/access_gate_utils.py
          python -m ruff check scripts/access_gate_utils.py
      - name: Run flake8
        run: |
          python -m flake8 --max-line-length=88 --exclude=scripts
          python -m flake8 --max-line-length=88 scripts/access_gate_utils.py

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest pytest-cov; fi

      - name: Run tests
        run: |
          bash ./scripts/run_tests.sh

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'Pipfile', 'buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            zip \
            unzip \
            build-essential \
            ccache \
            libltdl-dev \
            wget

      - name: Install Python dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer cython==0.29.33

      - name: Rename android_app.py to main.py
        run: |
          mv android_app.py main.py
          ls -la main.py
          echo "Building production version with enhanced logging"

      - name: Setup Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform

          wget -q --tries=5 --waitretry=5 --timeout=30 https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
          tmp_tools_dir=$(mktemp -d)
          unzip -q -o commandlinetools-linux-10406996_latest.zip -d "$tmp_tools_dir"
          mkdir -p android-sdk/cmdline-tools
          rm -rf android-sdk/cmdline-tools/latest
          mv "$tmp_tools_dir/cmdline-tools" android-sdk/cmdline-tools/latest
          rm -rf "$tmp_tools_dir"

          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"

      - name: Prefetch freetype source
        run: |
          mkdir -p ~/.buildozer/android/packages
          cd ~/.buildozer/android/packages
          if [ ! -f freetype-2.10.1.tar.gz ]; then
            echo "Downloading freetype from mirror"
            wget -q --tries=5 --waitretry=5 --timeout=30 \
              https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz \
              -O freetype-2.10.1.tar.gz
          fi

      - name: Build APK with Buildozer
        shell: bash
        run: |
          set -o pipefail
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          build_log="$RUNNER_TEMP/buildozer-android.log"
          : > "$build_log"
          build_succeeded=0
          for attempt in 1 2 3; do
            echo "Buildozer attempt $attempt" | tee -a "$build_log"
            if buildozer -v android debug 2>&1 | tee -a "$build_log"; then
              build_succeeded=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            else
              echo "Android build failed after $attempt attempts." | tee -a "$build_log"
              echo "Last 200 lines of the Buildozer log:" | tee -a "$build_log"
              tail -n 200 "$build_log"
              {
                echo "## Android build failure excerpt"
                echo
                echo '```text'
                tail -n 200 "$build_log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          if [ "$build_succeeded" -eq 1 ]; then
            cp "$build_log" buildozer-android.log
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-substations-apk-debug
          path: bin/*.apk
          retention-days: 90

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            buildozer-android.log
            bin/**
            .buildozer/**/buildozer.log
            .buildozer/android/platform/python-for-android/dist/*/build.log
            .buildozer/android/platform/python-for-android/dist/*/logs/**
            ~/.buildozer/android/platform/python-for-android/dist/*/build.log
            ~/.buildozer/android/platform/python-for-android/dist/*/logs/**
            ${{ runner.temp }}/buildozer-android.log
          if-no-files-found: warn
          retention-days: 30

      - name: List built APK
        if: success()
        run: |
          ls -lh bin/
          echo "Production APK built successfully"
          echo "Download from Actions artifacts"

      - name: Print diagnostic locations
        if: always()
        run: |
          echo "bin contents:"
          ls -la bin || true
          echo "Searching for buildozer logs:"
          find . ~/.buildozer -type f \( -name "buildozer.log" -o -name "build.log" \) 2>/dev/null || true
