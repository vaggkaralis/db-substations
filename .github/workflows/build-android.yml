name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'Pipfile', 'buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          build-essential \
          ccache \
          libltdl-dev \
          wget

    - name: Install Python dependencies
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade buildozer cython==0.29.33

    - name: Rename android_app.py to main.py
      run: |
        mv android_app.py main.py
        ls -la main.py
        echo "Building PRODUCTION version with enhanced logging"

    - name: Setup Android SDK
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        
        # Download and setup command line tools
        wget -q --tries=5 --waitretry=5 --timeout=30 https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        
        # Create symlink for buildozer compatibility (expects tools/bin)
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -s $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        
        # Accept licenses and install build tools with AIDL
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"

    - name: Prefetch freetype source
      run: |
        mkdir -p ~/.buildozer/android/packages
        cd ~/.buildozer/android/packages
        if [ ! -f freetype-2.10.1.tar.gz ]; then
          echo "Downloading freetype from mirror"
          wget -q --tries=5 --waitretry=5 --timeout=30 \
            https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz \
            -O freetype-2.10.1.tar.gz
        fi

    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        for attempt in 1 2 3; do
          echo "Buildozer attempt $attempt"
          if buildozer -v android debug; then
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 15))
          else
            exit 1
          fi
        done

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: db-substations-apk-debug
        path: bin/*.apk
        retention-days: 30
        
    - name: List built APK
      run: |
        ls -lh bin/
        echo "✅ Production APK built successfully!"
        echo "📦 Download from Actions artifacts"
