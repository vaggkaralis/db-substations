name: Build Android APK

# Manual trigger note: touch this file to trigger a fresh build via CI at 2026-03-28

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'Pipfile', 'buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-17-jdk \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          build-essential \
          ccache \
          libltdl-dev \
          wget

    - name: Install Python dependencies
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade buildozer cython==0.29.33

    - name: Rename android_app.py to main.py
      run: |
        mv android_app.py main.py
        ls -la main.py
        echo "Building PRODUCTION version with enhanced logging"

    - name: Setup Android SDK
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        
        # Download and setup command line tools
        wget -q --tries=5 --waitretry=5 --timeout=30 https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        tmp_tools_dir=$(mktemp -d)
        unzip -q -o commandlinetools-linux-10406996_latest.zip -d "$tmp_tools_dir"
        mkdir -p android-sdk/cmdline-tools
        rm -rf android-sdk/cmdline-tools/latest
        mv "$tmp_tools_dir/cmdline-tools" android-sdk/cmdline-tools/latest
        rm -rf "$tmp_tools_dir"
        
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        
        # Create symlink for buildozer compatibility (expects tools/bin)
        mkdir -p $ANDROID_SDK_ROOT/tools/bin
        ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager
        
        # Accept licenses and install build tools with AIDL
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

    - name: Prefetch freetype source
      run: |
        mkdir -p ~/.buildozer/android/packages
        cd ~/.buildozer/android/packages
        if [ ! -f freetype-2.10.1.tar.gz ]; then
          echo "Downloading freetype from mirror"
          wget -q --tries=5 --waitretry=5 --timeout=30 \
            https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz \
            -O freetype-2.10.1.tar.gz
        fi

    - name: Pre-download and patch p4a
      run: |
        # Clone p4a to the location buildozer expects so we can patch it
        P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
        if [ ! -d "$P4A_DIR" ]; then
          mkdir -p "$(dirname "$P4A_DIR")"
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git "$P4A_DIR"
        fi
        # Disable hardware acceleration to fix hwui mutex crash (FORTIFY
        # SIGABRT in hwuiTask/SDLActivity) on Android 16 + SDL2
        TMPL="$P4A_DIR/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml"
        if [ -f "$TMPL" ]; then
          sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="false"/g' "$TMPL"
          echo "Patched hardwareAccelerated in $TMPL"
          grep -n "hardwareAccelerated" "$TMPL"
        else
          echo "WARNING: p4a SDL2 manifest template not found at $TMPL"
        fi

    - name: Clear stale Android build state
      run: |
        # Force regeneration of the p4a dist and manifests so the patched
        # hardware acceleration setting is not bypassed by cached output.
        rm -rf .buildozer
        rm -rf bin
        rm -rf "$HOME/.buildozer/android/platform/build-arm64-v8a"*
        rm -rf "$HOME/.buildozer/android/platform/python-for-android/dist"/*
        mkdir -p bin

    - name: Build APK with Buildozer
      shell: bash
      run: |
        set -o pipefail
        export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        build_log="$RUNNER_TEMP/buildozer-android.log"
        : > "$build_log"
        # Re-apply hwui patch to any already-rendered manifests from cache
        find "$HOME/.buildozer" -name "AndroidManifest.xml" -path "*/dists/*" \
          -exec sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="false"/g' {} \; 2>/dev/null || true
        find "$HOME/.buildozer" -name "AndroidManifest.tmpl.xml" -path "*/sdl2/*" \
          -exec sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="false"/g' {} \; 2>/dev/null || true
        build_succeeded=0
        for attempt in 1 2 3; do
          echo "Buildozer attempt $attempt" | tee -a "$build_log"
          if buildozer -v android debug 2>&1 | tee -a "$build_log"; then
            build_succeeded=1
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 15))
          else
            echo "Android build failed after $attempt attempts." | tee -a "$build_log"
            echo "Last 200 lines of the Buildozer log:" | tee -a "$build_log"
            tail -n 200 "$build_log"
            {
              echo "## Android build failure excerpt"
              echo
              echo '```text'
              tail -n 200 "$build_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        done
        if [ "$build_succeeded" -eq 1 ]; then
          cp "$build_log" buildozer-android.log
        fi

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: db-substations-apk-debug-${{ github.sha }}
        path: bin/*.apk
        retention-days: 90

    - name: Upload Android build diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-diagnostics
        path: |
          buildozer-android.log
          bin/**
          .buildozer/**/buildozer.log
          .buildozer/android/platform/python-for-android/dist/*/build.log
          .buildozer/android/platform/python-for-android/dist/*/logs/**
          ~/.buildozer/android/platform/python-for-android/dist/*/build.log
          ~/.buildozer/android/platform/python-for-android/dist/*/logs/**
          ${{ runner.temp }}/buildozer-android.log
        if-no-files-found: warn
        retention-days: 30

    - name: List built APK
      if: success()
      run: |
        ls -lh bin/
        echo "Production APK built successfully"
        echo "Commit: $GITHUB_SHA"
        echo "Download from Actions artifacts"

    - name: Print diagnostic locations
      if: always()
      run: |
        echo "bin contents:"
        ls -la bin || true
        echo "Searching for buildozer logs:"
        find . ~/.buildozer -type f \( -name "buildozer.log" -o -name "build.log" \) 2>/dev/null || true
