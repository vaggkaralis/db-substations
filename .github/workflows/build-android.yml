name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
          openjdk-17-jdk zip unzip

    - name: Install buildozer
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade buildozer cython==0.29.33

    - name: Make buildozer directory
      run: |
        mkdir -p .buildozer

    - name: Build APK
      run: |
        yes | buildozer android debug || true
        buildozer android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: db-substations-apk
        path: bin/*.apk
        retention-days: 30
